name: build-rpm

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set version
        run: |
          sed -i 's/"version": "1.41.0-1"/"version": "1.41.0-293"/' package.json
          grep '"version"' package.json

      - name: Build
        run: |
          npm ci
          npm run ci:application
          npm run build
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: f5-telemetry-rpm
          path: dist/*.rpm