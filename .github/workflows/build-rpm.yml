name: Build TS RPM from PR

on:
  push:
    branches: [ build-pr293 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Force gzip RPM payload (BIG-IP compatible)
        run: |
          cat > ~/.rpmmacros <<'EOF'
          %_binary_payload w9.gzdio
          %_source_payload w9.gzdio
          EOF
          cat ~/.rpmmacros

      - name: Build RPM
        run: |
          npm ci
          npm run ci:application
          npm run build
          ls -la dist
          rpm -qp --qf '%{PAYLOADCOMPRESSOR}\n' dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: f5-telemetry-rpm
          path: dist/*.rpm